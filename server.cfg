# This file is a minimal version of the default config file.
# This is NOT supposed to be enough for most servers.
# Please read the fivem documentation:
#   https://aka.cfx.re/server-commands
#   https://docs.fivem.net/docs/server-manual/setting-up-a-server/

## You SHOULD edit the following:
sv_hostname "Orange County Roleplay"
sets sv_projectName "Orange County Roleplay looking for staff and leo"
sets sv_projectDesc "come join us we are a easy apply for all deparments"
sets tags "default, deployer"
sets locale "root-AQ"

load_server_icon OCDOJRP.png
set mysql_connection_string "mysql://root@localhost/ocrp?charset=utf8mb4"

exec permissions.cfg
## You CAN edit the following:
sv_enforceGameBuild 3258 #mp2024_01	- Bottom Dollar Bounties
sv_licenseKey "cfxk_1GizT5qgV8CucfVi0SGCR_2GTJju"
sv_maxclients 2048
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
set steam_webApiKey "none"
set resources_useSystemChat true

## These resources will start by default.
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap


# Main 
ensure [voice]
ensure [vMenu-scripts]
ensure [standalone]
ensure los_tunnel
ensure cfx-nteam-tunnel-paleto
ensure vMenu


## Add system admins
add_ace group.admin command allow # allow all commands
add_ace group.admin command.quit deny # but don't allow quit
add_principal identifier.fivem:13494530 group.admin #Fun-Nights-Roleplay
add_principal identifier.discord:1341684123789557852 group.admin #Fun-Nights-Roleplay





